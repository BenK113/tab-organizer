<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Organizer</title>
    <!-- A <link>, not an import from main.tsx. See the comment in style.css. -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Static chrome, painted before the bundle loads. React owns #root only,
           which is why the tab count lives inside the app and not up here. -->
      <header class="head">
        <h1>Tab Organizer</h1>
        <span class="tagline">Nothing moves until you apply</span>
      </header>
      <div id="root">
        <p class="muted">Reading tabs…</p>
      </div>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
