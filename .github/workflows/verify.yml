# The same gate as locally: `npm run verify` must pass, and the extension must
# still build. Nothing else — no publishing, no signing, no coverage badge.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run pointless. Cancel it rather than pay for it.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # v6 of both, not the v7s released days ago. setup-node v7 moved to ESM,
      # and a fresh major is not where a hobby project wants to find bugs.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Matches the machine this is developed on. Not "lts/*": a silent
          # bump to a new major is exactly the kind of surprise CI is meant
          # to catch, not to introduce.
          node-version: "24"
          cache: npm

      # `npm ci` installs from the lockfile and fails if it disagrees with
      # package.json. The postinstall hook runs `wxt prepare`, which generates
      # the .wxt/tsconfig.json that typecheck extends.
      - run: npm ci

      - run: npm run verify

      # verify is typecheck + lint + test, all of which are blind to the
      # manifest. The build is what would have caught MV2 being emitted
      # silently (D-011), and it takes under a second.
      - run: npm run build
